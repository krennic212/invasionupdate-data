name: Hourly harvest

on:
  schedule:
    # 3x daily, every day, ~9 AM, 12 PM, 5 PM Central (Krennic 2026-10-28). CDT = UTC-5.
    # After DST ends Nov 1 (CST = UTC-6), change to "2 15,18,23 * * *".
    # Government-site harvest runs Saturday and Sunday too. Not weekdays only.
    - cron: "2 14,17,22 * * *"
  workflow_dispatch:
    inputs:
      approve:
        description: 'Approve pending rows before harvesting: "all", or comma-separated row ids. Leave blank to only harvest.'
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: invasionupdate-data-harvest
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    env:
      # Approval gate. "true": new official rows go live at once, EXCEPT rows that trip a hard guard
      # (possible minor, stage escalation, at large, non-citizen not stated), which stay "pending". Set "false" to require approval for every new row.
      AUTO_APPROVE: "true"
      APPROVE_INPUT: ${{ github.event.inputs.approve }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install (sharp, for resizing official photos)
        run: npm ci --no-audit --no-fund
      # A pushed harvest.json edit that was not re-stamped is caught here, before the meta test.
      - name: Re-stamp harvest-meta.json if stale
        run: node scripts/write-meta.mjs
      - name: Tests
        run: node --test scripts/*.test.mjs
      - name: Approve pending rows (manual input only)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.approve != ''
        run: node scripts/approve.mjs "$APPROVE_INPUT"
      - name: Harvest official papers (DHS, ICE, CBP, DOJ)
        run: node scripts/harvest.mjs
      # Map points for rows with a stated place and no point: city-geo.json, then the free Nominatim geocoder
      # (1 request / second, results cached in scripts/city-geo.json). Never guesses a place.
      - name: Map points (city-geo.json + geocoder fallback)
        run: node scripts/geo.mjs data/harvest.json
      - name: Cut duplicates, blank photos, take live people out of review.json
        run: node scripts/dedupe.mjs data/harvest.json data/review.json
      - name: Official single-person release photos (copied into data/photos, never hotlinked)
        run: node scripts/photos.mjs
      - name: Severity scores (severity / severityReason / severityCrimes on every row) + data/highlights.json
        run: node scripts/severity.mjs
      - name: Tags (CHNV / DACA / Entered under Biden / Entered under Obama) from each row's own words
        run: node scripts/tags.mjs
      - name: Guardrail check (official source, date, status, photo rules, never shrinks)
        run: node scripts/validate.mjs data/harvest.json
      # write-meta.mjs runs every time: updatedAt stays while harvest.json is unchanged (same sha256) and is re-stamped
      # whenever harvest.json changed, in this run or in a pushed commit.
      - name: Stamp harvest-meta.json
        run: node scripts/write-meta.mjs
      - name: Did rows change?
        id: diff
        run: |
          if [ -z "$(git status --porcelain -- data/harvest.json data/harvest-meta.json data/review.json data/photos data/photo-checks.json data/highlights.json scripts/city-geo.json scripts/city-geo-misses.json)" ]; then
            git checkout -- data/harvest-status.json data/pending.json
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit only when rows changed
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "invasionupdate-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ scripts/city-geo.json scripts/city-geo-misses.json
          git commit -m "harvest: feed update $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          git pull --rebase --quiet && git push
      - name: Stage public files
        if: steps.diff.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        run: mkdir -p _site/photos && cp data/harvest.json data/harvest-meta.json data/harvest-status.json data/highlights.json data/operations.json _site/ && cp -r data/photos/. _site/photos/
      - uses: actions/upload-pages-artifact@v3
        if: steps.diff.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        with:
          path: _site

  publish:
    needs: harvest
    if: needs.harvest.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
